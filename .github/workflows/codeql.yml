# Static analysis of the JavaScript source (GitHub CodeQL). Results appear under Security > Code scanning.
name: codeql
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 5 * * 3'
permissions: {}
jobs:
  analyze:
    # Code scanning on a private repository needs GitHub code security (a paid feature); there the job is skipped instead of failing.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:javascript-typescript
