# Product site on GitHub Pages. Every six hours it refreshes site/stats.json from GitHub's own release download counts,
# regenerates the pages and deploys them. No pull_request trigger: fork PRs never reach the Pages token.
name: pages
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', 'README.md', 'docs/**', 'CHANGELOG.md', '.github/workflows/pages.yml']
permissions: {}
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Refresh download counts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node site/tools/fetch-stats.mjs "$GITHUB_REPOSITORY"
      - run: node site/tools/gen-docs.mjs
      - run: node --test site/site.test.mjs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
