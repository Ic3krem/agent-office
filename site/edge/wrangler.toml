# Cloudflare Worker config. Placeholders only: no secrets belong in this file.
# Secret (set with `wrangler secret put`, never committed): HASH_SALT.
name = "tiroagents-dl"
main = "worker.js"
compatibility_date = "2026-10-01"

# Turn off request-level logging so nothing about a visit is retained by the platform from our side.
[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "tiroagents-dl"
database_id = "6d5924b6-867b-4a45-83d7-838155d0b616"

[vars]
# Origin of the Pages site, no trailing slash. The only origin allowed to read /stats from a browser.
SITE_ORIGIN = "https://ic3krem.github.io"
# Release the /dl/<asset> links redirect to. Bump on every release.
DL_VERSION = "2.1.0"
# Downloads counted before this worker existed. Added to total and byPlatform (they have no region).
LEGACY_WINDOWS = "17"
LEGACY_MACOS = "22"
LEGACY_LINUX = "14"
