<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<title>Claude API key</title>
<style>body{font:14px system-ui,sans-serif;background:#1a1512;color:#f0e4d4;margin:18px}input{width:100%;padding:8px;box-sizing:border-box;background:#0e0b09;color:#f0e4d4;border:1px solid #4a3a2c;border-radius:6px}button{min-height:36px;padding:0 14px;margin-right:6px}#m{color:#ff9a8a;min-height:1.2em}</style>
</head>
<body>
<p>Paste your Claude API key from the Claude Console. It is kept encrypted on this PC and only Claude uses it.</p>
<input id="k" type="password" autofocus placeholder="sk-ant-..." aria-label="Claude API key" autocomplete="off">
<p id="m" role="alert"></p>
<button id="ok">Save</button><button id="no">Cancel</button>
<script>
const k = document.getElementById('k');
const go = () => { const v = k.value.trim(); if (!/^sk-ant-[A-Za-z0-9_-]{20,200}$/.test(v)) { document.getElementById('m').textContent = 'That does not look like a Claude API key (it starts with sk-ant-).'; return; } keyEntry.submit(v); };
document.getElementById('ok').onclick = go;
document.getElementById('no').onclick = () => keyEntry.cancel();
k.onkeydown = e => { if (e.key === 'Enter') go(); if (e.key === 'Escape') keyEntry.cancel(); };
</script>
</body>
</html>
