name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems do not belong here: report them privately (see SECURITY.md).
        Do not paste API keys, the contents of `bridge.json`, or private data from your agents.
  - type: input
    id: version
    attributes:
      label: Agent Office version
      description: Shown in the island Settings tab, or in package.json.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: For example from ~/.claude/agent-office/desktop.log. Remove anything private.
      render: text
