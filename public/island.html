<!doctype html>
<html data-form="transparent" data-look="glass" data-view="closed">
<head>
<meta charset="utf-8">
<title>Tiro Island</title>
<style>
  :root { --bg: #0b0807; --card: #17110e; --line: #261d17; --tile: #2a211b; --ink: #f0e4d4; --dim: #a8998a; --accent: #ffcf6b; --ok: #5fd38d; --warn: #ffb547; --bad: #ff7a6b; --mute: #8f8174; --top: 0px;
    --tint: rgba(14,16,20,.55); --glass: color-mix(in srgb, var(--bg) 84%, transparent); --cardbg: color-mix(in srgb, var(--card) 72%, transparent); }
  html[data-light] { --tint: rgba(246,241,234,.85); --mute: #7d6f62; }
  html[data-form=material] { --top: 12px; } /* the material window hangs 12 px above the screen: keep content out of it */
  *:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 8px; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font: 13px/1.35 'Instrument Sans', 'Segoe UI', sans-serif; color: var(--ink); user-select: none; }
  /* The notch hangs from the top edge, centred. Transparent form: this div is the shape (spring-sized in JS, bottom corners rounded).
     Material form: the window is the shape (the OS rounds its corners); the div fills it and only darkens the system blur. */
  #notch { position: absolute; top: 0; left: 50%; transform: translateX(-50%); overflow: hidden; outline: none; box-sizing: border-box; }
  html[data-form=transparent][data-look=glass] #notch { background: linear-gradient(180deg, rgba(255,255,255,.03), transparent 40%), var(--glass); box-shadow: inset 0 -1px 0 rgba(255,255,255,.08); }
  html[data-form=transparent][data-look=solid] #notch { background: var(--bg); box-shadow: inset 0 -1px 0 rgba(255,255,255,.06); }
  html[data-form=material] #notch { inset: 0; left: 0; transform: none; width: 100% !important; height: 100% !important; border-radius: 0 !important; background: var(--tint); }
  #notch::after { content: ''; position: absolute; inset: 0; box-sizing: border-box; border: 1px solid var(--glow, transparent); border-top-color: transparent; border-radius: inherit; pointer-events: none; transition: border-color .3s; }
  html[data-form=material] #notch::after { inset: auto 22px 0; height: 2px; border: 0; border-radius: 2px; background: var(--glow, transparent); } /* no outer border on the OS shape: a glow line along the bottom */
  #notch[data-tone=work] { --glow: var(--accent); } #notch[data-tone=ask] { --glow: rgba(255,181,71,.9); } #notch[data-tone=done] { --glow: rgba(95,211,141,.85); }
  #closed, #open { position: absolute; left: 0; right: 0; bottom: 0; top: var(--top); }
  html[data-view=open] #closed, html:not([data-view=open]) #open { display: none; }
  #open { display: flex; flex-direction: column; }
  #open.enter { animation: openin .22s ease-out; } @keyframes openin { from { opacity: 0; transform: translateY(-8px); } }
  .ic { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  /* closed: eyes and the time; line: what is next on the left, the approvals count on the right */
  .pill { display: flex; align-items: center; justify-content: center; gap: 10px; height: 100%; padding: 0 14px; white-space: nowrap; cursor: pointer; box-sizing: border-box; }
  .pill.line, .pill.game { justify-content: flex-start; }
  .pill .tm { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .pill .lt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
  .pill .rt { font-size: 12px; font-weight: 600; color: var(--warn); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #6b5a48; flex: none; }
  [data-tone=work] .dot { background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
  [data-tone=ask] .dot { background: var(--warn); animation: pulse .6s ease-in-out infinite; }
  [data-tone=done] .dot { background: var(--ok); }
  @keyframes pulse { 50% { transform: scale(1.5); opacity: .6; } }
  /* open: the bar (eyes, tabs, notice, date/time, pin, settings) and the page below it */
  .bar { display: flex; align-items: center; gap: 6px; padding: 6px 10px 4px; flex: none; }
  [role=tablist] { display: flex; gap: 2px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; padding: 2px; }
  [role=tab] { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 11px; border: 0; border-radius: 12px; background: transparent; color: var(--dim); font: inherit; font-size: 12px; cursor: pointer; white-space: nowrap; flex: none; }
  [role=tab]:hover { color: var(--ink); background: color-mix(in srgb, var(--ink) 7%, transparent); }
  [role=tab][aria-selected=true] { color: var(--ink); background: color-mix(in srgb, var(--accent) 18%, transparent); }
  [role=tab][aria-selected=true] .ic { color: var(--accent); }
  .badge { min-width: 16px; padding: 0 4px; border-radius: 8px; background: var(--warn); color: #241505; font-size: 10px; font-weight: 700; line-height: 16px; text-align: center; box-sizing: border-box; }
  .note-s { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--dim); }
  .now { text-align: right; font-size: 12px; line-height: 1.2; color: var(--dim); white-space: nowrap; font-variant-numeric: tabular-nums; } .now b { display: block; font-size: 14px; color: var(--ink); font-weight: 600; }
  .round { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--cardbg); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; flex: none; }
  .round:hover { border-color: var(--dim); } .round[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  #page { flex: 1; min-height: 0; overflow: auto; padding: 4px 14px 12px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; user-select: text; }
  /* Home: cards side by side; they scroll sideways rather than shrink below 200 px */
  .cards { display: flex; gap: 10px; height: 100%; overflow-x: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .card { flex: 1 1 200px; min-width: 200px; max-width: 360px; display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border-radius: 14px; background: var(--cardbg); border: 1px solid var(--line); box-sizing: border-box; overflow: hidden; }
  .card > header { display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); }
  .card > header span { flex: 1; } .card > header .ic { color: var(--accent); }
  .link { border: 0; background: transparent; color: var(--dim); font: inherit; font-size: 11px; letter-spacing: 0; text-transform: none; cursor: pointer; min-height: 40px; padding: 0 6px; border-radius: 8px; } .link:hover { color: var(--ink); }
  .big { font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px 18px; align-items: start; }
  .col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); margin-top: 4px; }
  .label small { font-weight: 400; letter-spacing: 0; text-transform: none; margin-left: 6px; }
  .ses, .goal { display: flex; align-items: center; gap: 8px; padding: 6px 9px; border-radius: 9px; background: var(--cardbg); border: 1px solid var(--line); min-width: 0; }
  .card .ses, .card .goal { padding: 4px 0; background: none; border: 0; }
  .ses .nm { font-weight: 600; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ses .tk { flex: 1; min-width: 0; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
  .ses .st { font-size: 11px; color: var(--dim); } .ses .st.working { color: var(--accent); } .ses .st.blocked, .ses .st.error { color: var(--bad); }
  .goal { font-size: 12px; } .goal span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ask { padding: 9px; border-radius: 10px; background: #2a1d0c; border: 1px solid #8a5a1c; display: flex; flex-direction: column; gap: 6px; color: #f6e7d2; }
  .ask .who { font-size: 12px; color: var(--warn); }
  .ask code { display: block; padding: 6px 8px; border-radius: 6px; background: #120c05; color: #ffd28a; font: 12px/1.4 Consolas, 'IBM Plex Mono', monospace; word-break: break-all; max-height: 64px; overflow: hidden; }
  .card .ask code { max-height: 38px; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .btn { min-height: 40px; min-width: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--ink); font: inherit; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 4px; transition: transform .12s cubic-bezier(.3,1.6,.5,1), background .15s; }
  .ask .btn { color: #f6e7d2; border-color: #5a3d17; }
  .btn:hover { background: var(--tile); transform: translateY(-1px); } .btn:active { transform: scale(.95); } .btn:disabled { opacity: .35; pointer-events: none; }
  .btn.yes, .ask .btn.yes { background: var(--ok); border-color: var(--ok); color: #0c2416; font-weight: 600; } .btn.yes:hover { background: #7be3a6; }
  .btn.no, .ask .btn.no { border-color: var(--bad); color: #ff9a8d; }
  .ask input.why { min-height: 40px; box-sizing: border-box; padding: 0 10px; border-radius: 10px; border: 1px solid #5a3d17; background: #120c05; color: #f6e7d2; font: inherit; font-size: 12px; }
  kbd { font: 10px Consolas, monospace; opacity: .65; margin-left: 4px; }
  .empty { color: var(--mute); font-size: 12px; padding: 2px 0; }
  .trow, .nrow { display: flex; align-items: center; gap: 6px; min-width: 0; padding: 2px 0; }
  .trow .tn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; } .trow .tn small { color: var(--mute); }
  .tl { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 64px; text-align: right; } .trow.done .tl { color: var(--accent); }
  .gauge, .crow { display: grid; grid-template-columns: minmax(0, 1fr) 90px auto; align-items: center; gap: 2px 8px; padding: 3px 0; }
  .gauge .gl { font-size: 12px; } .gv { font-size: 13px; font-variant-numeric: tabular-nums; text-align: right; } .gv small { font-weight: 400; color: var(--accent); }
  .gauge .gn { grid-column: 1 / -1; color: var(--mute); font-size: 11px; }
  .gbar { height: 6px; border-radius: 3px; background: var(--tile); overflow: hidden; } .gbar i { display: block; height: 100%; background: var(--accent); }
  .ftstrip { display: block; width: 100%; height: 30px; margin: 2px 0 4px; background: var(--tile); border-radius: 4px; } .ftstrip rect { fill: var(--accent); } /* static: redrawn with new values, never animated */
  .crow { grid-template-columns: minmax(0, 1fr) 70px auto auto auto auto; } .crow .tn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
  .ntxt { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 2px 0; }
  .col input[type=text], .col input[type=password], .col input[type=number], .card input[type=text] { min-height: 40px; box-sizing: border-box; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--cardbg); color: var(--ink); font: inherit; font-size: 12px; outline: none; }
  .col input[type=text]:focus, .col input[type=password]:focus, .col input[type=number]:focus, .card input[type=text]:focus { border-color: var(--accent); }
  .nrow input[type=text] { flex: 1; min-width: 0; } input[type=number] { width: 64px; }
  .num { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--dim); } .num input { width: 80px; }
  .dock { display: flex; gap: 6px; flex-wrap: wrap; }
  .dock .btn { flex-direction: column; gap: 2px; min-width: 70px; padding: 6px 10px; border-radius: 12px; background: var(--cardbg); }
  .dock .lb { font-size: 11px; color: var(--dim); }
  form.chat { display: none; gap: 6px; } form.chat.on { display: flex; }
  form.chat input, .set input[type=text] { min-height: 40px; box-sizing: border-box; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--cardbg); color: var(--ink); font: inherit; font-size: 12px; outline: none; }
  form.chat input { flex: 1; min-width: 0; } form.chat input:focus, .set input[type=text]:focus { border-color: var(--accent); }
  .clock { display: flex; gap: 22px; align-items: baseline; }
  .clock b { font-size: 34px; font-weight: 600; letter-spacing: .02em; font-variant-numeric: tabular-nums; } .clock small { font-size: 11px; color: var(--dim); margin-left: 5px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; font-size: 12px; }
  .cal .h { color: var(--dim); font-size: 11px; } .cal .d { padding: 3px 0; border-radius: 7px; font-variant-numeric: tabular-nums; } .cal .d.today { background: var(--accent); color: var(--bg); font-weight: 700; }
  .calhead { display: flex; align-items: center; justify-content: space-between; } .calhead b { font-size: 13px; }
  .settings { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px 22px; align-items: start; }
  .sect { display: flex; flex-direction: column; gap: 6px; }
  .set { display: flex; align-items: center; justify-content: space-between; gap: 10px; } .set > span:first-child { color: var(--dim); font-size: 12px; flex: 1 1 90px; } .set > span:last-child:not(:first-child) { text-align: right; min-width: 0; overflow-wrap: anywhere; }
  .chips { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; align-items: center; } .chips .btn { padding: 0 10px; } .chips .btn.on, .hc .btn.on { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
  .btn.sw { padding: 0; border-color: transparent; } .btn.sw::before { content: ''; width: 18px; height: 18px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 2px var(--ring, transparent); }
  .btn.sw[aria-pressed=true] { --ring: var(--ink); }
  .set input[type=color] { width: 40px; height: 40px; padding: 0; border: 1px solid var(--line); background: transparent; border-radius: 10px; }
  .set input[type=text] { width: 190px; max-width: 100%; }
  .hc { display: flex; align-items: center; gap: 6px; } .hc > span { flex: 1; font-size: 12px; } .hc.off > span { color: var(--mute); }
  .hint { font-size: 11px; color: var(--mute); }
  .note { padding: 8px 10px; border-radius: 8px; font-size: 12px; line-height: 1.4; }
  .note.bad { background: #2a1210; border: 1px solid #7a2e26; color: #ffb1a6; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  /* Tiro face: two eyes on a small tile. JS sets --lx/--ly (look) and toggles .blink; data-mood drives the CSS animations. */
  .face { position: relative; display: none; font-size: 4px; gap: 1em; align-items: center; justify-content: center; width: 6em; height: 4.5em; border-radius: 1.75em; background: var(--tile); flex: none; --lx: 0px; --ly: 0px; --bl: 1; --eh: 1.75em; --ew: 1em; }
  .face.big { font-size: 5px; } /* closed notch: the eyes are most of the display, so they are bigger */
  html[data-face=on] .face { display: inline-flex; } html[data-face=on] .dot { display: none; }
  .face .eye { width: var(--ew); height: var(--eh); border-radius: .75em; background: var(--accent); transform: translate(var(--lx), var(--ly)) scaleY(var(--bl)); transition: transform .18s ease-out, height .2s, width .2s, background .2s, border-radius .2s; }
  .face.blink { --bl: .12; } .face.blink .eye { transition-duration: .06s; }
  .face[data-mood=idle] { animation: breathe 4.2s ease-in-out infinite; } /* data-anim goes off while idle and closed (power saver), which stops this */
  .face[data-mood=work] .eye { animation: scan .9s ease-in-out infinite alternate; }
  .face[data-mood=ask] { animation: nudge .6s ease-in-out infinite; --eh: 2.25em; } .face[data-mood=ask] .eye { background: var(--warn); }
  .face[data-mood=done] { --eh: .75em; --ew: 1.25em; } .face[data-mood=done] .eye { border-radius: 1.25em 1.25em 0 0; background: var(--ok); }
  .face[data-mood=music] { animation: bob .5s ease-in-out infinite alternate; } .face[data-mood=music] .eye { animation: sway .5s ease-in-out infinite alternate; }
  .face[data-mood=off] { --eh: .5em; } .face[data-mood=off] .eye { opacity: .5; }
  @keyframes breathe { 50% { transform: scale(1.07); } }
  @keyframes scan { from { translate: -.5em 0; } to { translate: .5em 0; } }
  @keyframes nudge { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-1.5px); } 75% { transform: translateX(1.5px); } }
  @keyframes bob { from { transform: translateY(1px) rotate(-4deg); } to { transform: translateY(-2px) rotate(4deg); } }
  @keyframes sway { from { translate: -.4em 0; } to { translate: .4em 0; } }
  .media { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .media .meta { flex: 1; min-width: 0; display: flex; flex-direction: column; } .media .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .media .a { font-size: 12px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .media.large .t { font-size: 22px; } .media.large .a { font-size: 13px; } .media.large .lyr { font-size: 18px; margin-top: 10px; white-space: normal; }
  .eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 11px; flex: none; } .eq i { width: 2px; height: 3px; background: var(--accent); border-radius: 1px; animation: eq .8s ease-in-out infinite alternate; }
  .eq i:nth-child(2) { animation-delay: -.3s; } .eq i:nth-child(3) { animation-delay: -.6s; } @keyframes eq { to { height: 11px; } }
  .eq.still i { animation: none; }
  .lyr { display: block; min-height: 1.3em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; line-height: 1.3; color: var(--accent); opacity: 1; transition: opacity .18s ease; }
  .pill .lyr { color: var(--ink); min-height: 0; flex: 1; min-width: 0; }
  .lyr.out { opacity: 0; }
  html[data-anim=off] *, html[data-anim=off] *::after { animation: none !important; transition: none !important; }
  html[data-still] #open, html[data-still] .btn, html[data-still] #notch::after { animation: none !important; transition: none !important; }
  @media (prefers-reduced-motion: reduce) { .dot, .btn, .face, .face .eye, .eq i, .lyr, #open, #notch::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="notch" tabindex="-1" data-tone="off">
  <div id="closed"></div>
  <div id="open">
    <div class="bar">
      <span id="faceOpen"></span>
      <div role="tablist" id="tabs" aria-label="Notch"></div>
      <span class="note-s" id="notice"></span>
      <span class="now" id="now"></span>
      <button class="round" id="pinBtn" aria-label="Keep the notch open" aria-pressed="false"></button>
      <button class="round" id="setBtn" aria-label="Settings" aria-pressed="false" aria-controls="page"></button>
    </div>
    <div id="page" role="tabpanel"></div>
  </div>
  <div id="status" class="sr" role="status" aria-live="polite"></div>
</div>
<script src="./notch-core.js"></script>
<script src="./notch-views.js"></script>
<script src="./notch-page.js"></script>
</body>
</html>
