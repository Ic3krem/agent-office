<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Tiro Island</title>
<style>
  :root { --bg: #0b0807; --card: #17110e; --line: #261d17; --tile: #2a211b; --ink: #f0e4d4; --dim: #a8998a; --accent: #ffcf6b; --ok: #5fd38d; --warn: #ffb547; --bad: #ff7a6b; --mute: #8f8174; }
  *:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 6px; }
  #isle:focus-visible, #pill:focus-visible { outline-offset: -2px; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font: 13px/1.35 'Instrument Sans', 'Segoe UI', sans-serif; color: var(--ink); user-select: none; }
  /* The island hangs from the top edge of the screen, centred. Width/height are driven by a spring in JS. */
  #isle { position: absolute; top: 0; left: 50%; transform: translateX(-50%); background: var(--bg); border-radius: 0 0 22px 22px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.5), inset 0 -1px 0 rgba(255,255,255,.06); outline: none; }
  #isle { transition: opacity .25s, transform .25s; }
  #isle.away { opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(-14px); } /* Smart mode: idle, fullscreen app, or not peeked */
  #isle::after { content: ''; position: absolute; inset: 0; box-sizing: border-box; border: 1px solid var(--glow, transparent); border-top-color: transparent; border-radius: inherit; pointer-events: none; transition: border-color .3s; }
  #isle[data-tone=work] { --glow: var(--accent); }
  #isle[data-tone=ask] { --glow: rgba(255,181,71,.9); }
  #isle[data-tone=done] { --glow: rgba(95,211,141,.85); }
  #isle[data-tone=off] { --glow: rgba(255,255,255,.12); }
  #in { max-height: 430px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; position: absolute; top: 0; left: 50%; transform: translateX(-50%); box-sizing: border-box; padding: 0; }
  .pill { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; white-space: nowrap; cursor: pointer; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #6b5a48; flex: none; }
  [data-tone=work] .dot { background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
  [data-tone=ask] .dot { background: var(--warn); animation: pulse .6s ease-in-out infinite; }
  [data-tone=done] .dot { background: var(--ok); }
  @keyframes pulse { 50% { transform: scale(1.5); opacity: .6; } }
  .pill .txt { flex: 1; max-width: 380px; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
  .pill .cnt { font-size: 11px; color: var(--dim); }
  .pill .cnt b { color: var(--warn); }
  .body { padding: 4px 16px 12px; display: flex; flex-direction: column; gap: 8px; }
  .label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); margin-top: 4px; }
  .label small { font-weight: 400; letter-spacing: 0; text-transform: none; margin-left: 6px; }
  .ses, .goal { display: flex; align-items: center; gap: 8px; padding: 6px 9px; border-radius: 9px; background: var(--card); border: 1px solid var(--line); min-width: 0; }
  .ses .nm { font-weight: 600; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ses .tk { flex: 1; min-width: 0; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
  .ses .st { font-size: 11px; color: var(--dim); }
  .ses .st.working { color: var(--accent); } .ses .st.blocked, .ses .st.error { color: var(--bad); }
  .goal { color: var(--ink); font-size: 12px; } .goal span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ask { padding: 9px; border-radius: 10px; background: #2a1d0c; border: 1px solid #8a5a1c; display: flex; flex-direction: column; gap: 6px; }
  .ask .who { font-size: 12px; color: var(--warn); }
  .ask code { display: block; padding: 6px 8px; border-radius: 6px; background: #120c05; color: #ffd28a; font: 12px/1.4 Consolas, 'IBM Plex Mono', monospace; word-break: break-all; max-height: 64px; overflow: hidden; }
  .row { display: flex; gap: 6px; align-items: center; }
  .btn { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink); font: inherit; font-size: 12px; cursor: pointer; transition: transform .12s cubic-bezier(.3,1.6,.5,1), background .15s; }
  .btn:hover { background: var(--tile); transform: translateY(-1px); } .btn:active { transform: scale(.95); }
  .btn.yes { background: var(--ok); border-color: var(--ok); color: #0c2416; font-weight: 600; }
  .btn.yes:hover { background: #7be3a6; }
  .btn.no { border-color: var(--bad); color: #ff9a8d; }
  kbd { font: 10px Consolas, monospace; opacity: .65; margin-left: 4px; }
  .empty { color: var(--mute); font-size: 12px; padding: 2px 0; }
  .dock { display: flex; gap: 6px; justify-content: center; padding-top: 4px; border-top: 1px solid var(--line); margin-top: 2px; }
  .dock .btn { display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 70px; padding: 7px 10px; border-radius: 12px; background: var(--card); }
  .dock .ic { font-size: 17px; line-height: 1; } .dock .lb { font-size: 11px; color: var(--dim); }
  .dock .btn:hover { transform: translateY(-4px) scale(1.08); }
  form.chat { display: none; gap: 6px; } form.chat.on { display: flex; }
  form.chat input { flex: 1; min-width: 0; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; outline: none; }
  form.chat input:focus { border-color: #6b5a48; }
  .tabs { display: flex; gap: 4px; } .tabs .btn { padding: 3px 10px; font-size: 12px; } .tabs .btn.on { background: var(--tile); border-color: var(--accent); }
  .clock { display: flex; gap: 22px; align-items: baseline; justify-content: center; }
  .clock b { font-size: 34px; font-weight: 600; letter-spacing: .02em; font-variant-numeric: tabular-nums; } .clock small { font-size: 11px; color: var(--dim); margin-left: 5px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; font-size: 12px; }
  .cal .h { color: var(--dim); font-size: 11px; } .cal .d { padding: 4px 0; border-radius: 7px; font-variant-numeric: tabular-nums; } .cal .d.today { background: var(--accent); color: var(--bg); font-weight: 700; }
  .calhead { display: flex; align-items: center; justify-content: space-between; } .calhead b { font-size: 13px; }
  .set { display: flex; align-items: center; justify-content: space-between; gap: 10px; } .set > span:first-child { color: var(--dim); font-size: 12px; min-width: 110px; flex: none; } .set > span:last-child:not(:first-child) { text-align: right; min-width: 0; overflow-wrap: anywhere; user-select: text; }
  .chips { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; align-items: center; } .chips .btn { padding: 3px 9px; font-size: 12px; } .chips .btn.on { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
  .chips .btn.sw { width: 18px; height: 18px; padding: 0; border-radius: 50%; }
  .set input[type=color] { width: 34px; height: 24px; padding: 0; border: 1px solid var(--line); background: transparent; border-radius: 6px; }
  .set input[type=text] { width: 200px; max-width: 100%; box-sizing: border-box; padding: 4px 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-size: 12px; outline: none; }
  .hint { font-size: 11px; color: var(--mute); text-align: center; }
  .note { padding: 8px 10px; border-radius: 8px; font-size: 12px; line-height: 1.4; user-select: text; }
  .note.warn { background: #2a1d0c; border: 1px solid #8a5a1c; color: #ffd28a; }
  .note.bad { background: #2a1210; border: 1px solid #7a2e26; color: #ffb1a6; }
  .sect { display: flex; flex-direction: column; gap: 8px; }
  /* Tiro face: two eyes on a small tile. JS sets --lx/--ly (look) and toggles .blink; data-mood drives the CSS animations. */
  .face { position: relative; display: none; font-size: 4px; gap: 1em; align-items: center; justify-content: center; width: 6em; height: 4.5em; border-radius: 1.75em; background: var(--tile); flex: none; --lx: 0px; --ly: 0px; --bl: 1; --eh: 1.75em; --ew: 1em; }
  .face.big { font-size: 5.5px; } /* compact notch: the eyes are the whole display, so they are bigger */
  html[data-face=on] .face { display: inline-flex; } html[data-face=on] .dot { display: none; }
  .face .eye { width: var(--ew); height: var(--eh); border-radius: .75em; background: var(--accent); transform: translate(var(--lx), var(--ly)) scaleY(var(--bl)); transition: transform .18s ease-out, height .2s, width .2s, background .2s, border-radius .2s; }
  .face.blink { --bl: .12; } .face.blink .eye { transition-duration: .06s; }
  .face[data-mood=idle] { animation: breathe 4.2s ease-in-out infinite; } /* data-anim goes off while idle and collapsed (power saver), which stops this */
  .face[data-mood=work] .eye { animation: scan .9s ease-in-out infinite alternate; }
  .face[data-mood=ask] { animation: nudge .6s ease-in-out infinite; --eh: 2.25em; } .face[data-mood=ask] .eye { background: var(--warn); }
  .face[data-mood=done] { --eh: .75em; --ew: 1.25em; } .face[data-mood=done] .eye { border-radius: 1.25em 1.25em 0 0; background: var(--ok); }
  .face[data-mood=music] { animation: bob .5s ease-in-out infinite alternate; } .face[data-mood=music] .eye { animation: sway .5s ease-in-out infinite alternate; }
  .face[data-mood=off] { --eh: .5em; } .face[data-mood=off] .eye { opacity: .5; }
  @keyframes breathe { 50% { transform: scale(1.07); } }
  @keyframes scan { from { translate: -.5em 0; } to { translate: .5em 0; } }
  @keyframes nudge { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-1.5px); } 75% { transform: translateX(1.5px); } }
  @keyframes bob { from { transform: translateY(1px) rotate(-4deg); } to { transform: translateY(-2px) rotate(4deg); } }
  @keyframes sway { from { translate: -.4em 0; } to { translate: .4em 0; } }
  /* Idle breathing of the notch edge glow, and the entrance animations (classes are added by JS only on a state change, never on a plain re-render). */
  .body.enter { animation: bodyin .24s ease-out; } @keyframes bodyin { from { opacity: 0; transform: translateY(-6px); } }
  .np { display: inline-flex; align-items: center; gap: 6px; max-width: 190px; padding: 2px 8px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); font-size: 12px; color: var(--dim); overflow: hidden; flex: none; }
  .np.enter { animation: chipin .35s cubic-bezier(.3,1.4,.5,1); } @keyframes chipin { from { opacity: 0; max-width: 0; padding: 2px 0; transform: translateX(14px); } }
  .np .npt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 11px; flex: none; } .eq i { width: 2px; height: 3px; background: var(--accent); border-radius: 1px; animation: eq .8s ease-in-out infinite alternate; }
  .eq i:nth-child(2) { animation-delay: -.3s; } .eq i:nth-child(3) { animation-delay: -.6s; } @keyframes eq { to { height: 11px; } }
  .pill.hasnp .txt { max-width: 230px; }
  /* Compact notch: the Tiro eyes only. While music plays, title + artist (subtle) and the synced lyric line sit beside them in a fixed-width block, so the notch never wobbles as lines change. */
  .pill.compact { justify-content: center; min-width: 80px; box-sizing: border-box; gap: 10px; }
  .pill.compact.hasmus { width: 440px; justify-content: flex-start; height: auto; min-height: 36px; padding: 6px 16px; }
  .pill.compact.haslyr { min-height: 48px; }
  .mus { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .mus .mt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 600; line-height: 1.3; }
  .mus .mt i { font-style: normal; font-weight: 400; font-size: 11px; color: var(--dim); }
  .lyr { display: block; min-height: 1.3em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; line-height: 1.3; color: var(--ink); opacity: 1; transition: opacity .18s ease; }
  .lyr.out { opacity: 0; }
  .media .lyr { font-size: 12px; color: var(--accent); min-height: 0; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .media { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); min-width: 0; }
  .media .meta { flex: 1; min-width: 0; display: flex; flex-direction: column; } .media .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .media .a { font-size: 12px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .media .btn { padding: 3px 9px; min-width: 30px; } .media .btn:disabled { opacity: .35; pointer-events: none; }
  html[data-anim=off] *, html[data-anim=off] *::after { animation: none !important; transition: none !important; }
  @media (prefers-reduced-motion: reduce) { .dot, .btn, .face, .face .eye, .eq i, .np, .body, .lyr, #isle::after { animation: none !important; transition: none !important; } }
</style>

<body>
<div id="isle" data-hit tabindex="-1" data-tone="off" aria-live="polite">
  <div id="in"></div>
</div>
<script>
const nonce = () => (document.cookie.match(/(?:^|; )ao_nonce=([^;]*)/) || [])[1] || '';
const desk = window.islandDesk || { guard: { get: async () => null, set: async () => null, remember: async () => null, forget: async () => null }, interactive() {}, office() {}, focus() {}, settings() {}, mute() {}, media() {}, onNowPlaying() {}, onLyrics() {}, update: { get: async () => null, check: async () => null, install: async () => null, set: async () => null, on() {} }, onToggle() {}, onState() {} };
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const api = (p, body) => fetch(p, { method: 'POST', headers: { 'content-type': 'application/json', 'x-nonce': nonce() }, body: JSON.stringify(body || {}) })
  .then(async r => { const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status); return j; });

// ---------- spring: a damped oscillator per property, so size changes overshoot slightly and settle ----------
const spring = (v, k = 230, c = 21) => ({ v, t: v, s: 0, k, c });
const W = spring(150), H = spring(36), R = spring(18);
let raf = 0, last = 0, hit = false;
const reduceMQ = matchMedia('(prefers-reduced-motion: reduce)');
const still = () => reduceMQ.matches || S.animate === false; // OS reduced-motion or the Animations pref
function step(now) {
  const dt = Math.min(0.032, (now - last) / 1000 || 0.016); last = now;
  let moving = false;
  for (const p of [W, H, R]) {
    if (still()) { p.v = p.t; p.s = 0; continue; }
    p.s += (-p.k * (p.v - p.t) - p.c * p.s) * dt; p.v += p.s * dt;
    if (Math.abs(p.v - p.t) > .2 || Math.abs(p.s) > .5) moving = true; else { p.v = p.t; p.s = 0; }
  }
  const el = $('isle');
  el.style.width = Math.max(60, W.v) + 'px'; el.style.height = Math.max(24, H.v) + 'px'; el.style.borderRadius = `0 0 ${Math.max(8, R.v)}px ${Math.max(8, R.v)}px`;
  raf = moving ? requestAnimationFrame(step) : 0;
  if (!moving && hit && !expanded()) { hit = false; desk.interactive(false); } // collapsed: stop swallowing clicks until the mouse moves again
}
function aim(w, h, r) { W.t = w; H.t = h; R.t = r; if (!raf) { last = performance.now(); raf = requestAnimationFrame(step); } }

// ---------- state ----------
let snap = null, prev = null, online = false;
let pinned = false, hovered = false, chatOn = false, toast = null, toastTimer = 0, leaveTimer = 0;
let mode = 'always', mute = false, fsApp = false, peek = false;
let panel = 'home', calOff = 0; // home | calendar | settings; calOff = months away from the current one
const DEF = { theme: 'ember', accent: '#ffcf6b', physics: 'default', pinned: ['today', 'reports', 'usage', 'chat'], hour12: false, clockInPill: true, zone2: '', zone2Label: '', weekStart: 1, edgeDelay: 0, leaveDelay: 900, nowPlaying: true, kiroFace: true, animate: true, powerSaver: true, lyrics: false, notchEnabled: true, notchShortcut: '' };
let S = { ...DEF };
let lyr = null, lyrIdx = -2, lyrTimer = 0; // synced lyrics {key, lines:[{t,text}]} pushed from the desktop, last shown line index, fade timer
let np = null, npEnter = false, wasEx = false; // now-playing session (from SMTC), chip entrance flag, previous expanded state
// Display copy of desktop/island-logic.mjs (the tested, authoritative one); main.mjs validates every patch before it is saved.
const THEMES = {
  ember: { bg: '#0b0807', card: '#17110e', line: '#261d17', ink: '#f0e4d4', dim: '#a8998a', accent: '#ffcf6b', tile: '#2a211b' },
  midnight: { bg: '#080b12', card: '#10151f', line: '#1c2433', ink: '#e4ebf7', dim: '#8d9ab0', accent: '#6bb2ff', tile: '#2a211b' },
  forest: { bg: '#08100b', card: '#101a14', line: '#1b2a21', ink: '#e1f0e6', dim: '#8aa394', accent: '#6bdb94', tile: '#2a211b' },
  light: { bg: '#f6f1ea', card: '#ebe3d8', line: '#d9cfc0', ink: '#2a211b', dim: '#6f6256', accent: '#b8620a', tile: '#e0d6c8' },
};
const PHYS = { soft: [140, 22], default: [230, 21], snappy: [380, 34], bouncy: [260, 13] };
const ACT = { today: ['☰', 'Today'], reports: ['▤', 'Reports'], usage: ['◔', 'Usage'], office: ['⌂', 'Office'], chat: ['✎', 'Chat'], calendar: ['▦', 'Calendar'], mute: ['♪', 'Chime'], settings: ['⚙', 'Settings'] };
const guardText = g => [g.title, 'Rules: ' + (g.rules || []).join(', '), (g.files && g.files.length) ? 'Files: ' + g.files.map(f => f.path + ' (' + f.why + ((f.preview && f.preview.length) ? '; ' + f.preview.slice(0, 3).join(', ') : '') + ')').join('; ') : '', g.host ? 'Destination: ' + g.host : '', g.exact === false ? 'Payload: estimated' : 'Payload: exact', g.source ? 'Source: ' + g.source : '', g.rememberable ? '' : 'This kind of request cannot be remembered.'].filter(Boolean).join('\n');
let GV = null; // Security Guard settings as the desktop shell reports them (loaded when the Settings tab opens)
let shortcutOk = true; // false when the desktop could not register the chosen notch shortcut (another program owns it)
const saver = () => S.powerSaver !== false;
let curMood = 'idle';
// Power saver: animations run only while expanded or something is happening (working, asking, music, a toast); an idle collapsed notch holds still.
function animOn() { return S.animate && !(saver() && !expanded() && (curMood === 'idle' || curMood === 'off' || curMood === 'done')); }
function syncAnim() { const v = animOn() ? 'on' : 'off'; if (document.documentElement.dataset.anim !== v) document.documentElement.dataset.anim = v; }
function applySettings(s) {
  S = { ...DEF, ...s }; try { localStorage.setItem('ao.powerSaver', saver() ? '1' : '0'); } catch (e) { } // shared with the office page and Tiro
  const t = S.theme === 'custom' ? { ...THEMES.ember, accent: S.accent } : THEMES[S.theme] || THEMES.ember, st = document.documentElement.style;
  document.documentElement.dataset.face = S.kiroFace ? 'on' : 'off'; syncAnim();
  for (const k of ['bg', 'card', 'line', 'ink', 'dim', 'accent', 'tile']) st.setProperty('--' + k, t[k]);
  const [k, c] = PHYS[S.physics] || PHYS.default; for (const p of [W, H, R]) { p.k = k; p.c = c; }
}
const clockStr = (zone, d = new Date()) => { try { return new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', hour12: !!S.hour12, ...(zone ? { timeZone: zone } : {}) }).format(d).replace(/\s?([ap])m$/i, (_m, x) => ' ' + x.toUpperCase() + 'M'); } catch { return ''; } };
const setPref = patch => desk.settings(patch);
const dismissed = new Set(); // approvals the user waved away with Esc
const asksOf = s => (s?.agents || []).filter(a => a.perm);
const hiresOf = s => s?.hires || [];   // pending hire approvals asked by the manager
const mgrName = () => snap?.names?.tiro || 'Tiro';
const working = s => (s?.agents || []).filter(a => a.status === 'working' || a.isManager && s.boss?.running);


// ---------- chime: two short synthesized notes (WebAudio, no asset files); ask = rising pair, done = falling pair ----------
let actx = null;
function chime(kind) {
  if (mute || mode === 'off') return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const notes = kind === 'ask' ? [660, 880] : [880, 659], t0 = actx.currentTime + 0.02;
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = t0 + i * 0.13;
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.16, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.3);
    });
  } catch {}
}
const askIds = s => new Set(asksOf(s).map(a => a.perm.askId));

function showToast(html, ms = 5500) { toast = html; clearTimeout(toastTimer); toastTimer = setTimeout(() => { toast = null; render(); }, ms); render(); }
function notice(next) {
  if (!prev) return;
  const seen = askIds(prev);
  if ([...askIds(next)].some(id => !seen.has(id))) chime('ask');
  const before = Object.fromEntries((prev.goals || []).map(g => [g.id, g.status]));
  for (const g of next.goals || []) {
    if (!before[g.id]) continue;
    if (g.status === 'done' && before[g.id] !== 'done') { showToast('<b>Done.</b> ' + esc(g.text.slice(0, 80))); chime('done'); }
    if (g.status === 'blocked' && before[g.id] !== 'blocked') showToast('<b>Blocked.</b> ' + esc((g.note || g.text).slice(0, 80)), 8000);
  }
  if ((next.reportsN || 0) > (prev.reportsN || 0)) showToast('New report ready on the shelf.');

  if (gb) { const patch = { [gb.dataset.guard]: gb.dataset.v }; desk.guard.set(patch).then(v => { if (v) GV = v; render(); }).catch(() => {}); return; }
  const st = e.target.closest('[data-set]');
  if (st) { const v = st.dataset.v; setPref({ [st.dataset.set]: v === 'true' ? true : v === 'false' ? false : /^-?\d+$/.test(v) ? +v : v }); return; }
  const pin = e.target.closest('[data-pin]');
  if (pin) { const k = pin.dataset.pin; setPref({ pinned: S.pinned.includes(k) ? S.pinned.filter(x => x !== k) : [...S.pinned, k] }); return; }
  if (e.target.closest('[data-reset]')) { setPref({ ...DEF, pinned: ['today', 'reports', 'usage', 'chat', 'calendar', 'settings'] }); return; }
  const dk = e.target.closest('[data-dock]');
  if (dk) {
    const k = dk.dataset.dock;
    if (k === 'chat') { chatOn = !chatOn; panel = 'home'; render(); desk.focus(); setTimeout(() => $('chatIn')?.focus(), 40); }
    else if (k === 'calendar' || k === 'settings') { panel = panel === k ? 'home' : k; render(); }
    else if (k === 'mute') desk.mute(!mute);
    else desk.office(k);
    return;
  }
  if (e.target.closest('#pill')) { pinned = !pinned; if (pinned) desk.focus(); render(); }
});
isle.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('[data-color]')) setPref({ theme: 'custom', accent: t.value });
  else if (t.matches('[data-nshort]')) setPref({ notchShortcut: t.value.trim() });
  else if (t.matches('[data-zone]')) setPref({ zone2: t.value.trim() });
  else if (t.matches('[data-zlabel]')) setPref({ zone2Label: t.value.trim() });
});
isle.addEventListener('submit', e => {
  e.preventDefault();
  const input = $('chatIn'), text = input.value.trim(); if (!text) return;
  input.value = '';
  const boss = (snap?.agents || []).find(x => x.isManager);
  (boss && snap.boss?.active ? api('/api/send', { id: boss.id, text }) : api('/api/task', { text }))
    .then(() => showToast('Sent to ' + esc(mgrName()) + '.', 2500)).catch(err => showToast(esc(err.message), 4000));
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { pinned = chatOn = hovered = false; asksOf(snap).forEach(a => dismissed.add(a.perm.askId)); render(); return; }
  if (e.target.tagName === 'INPUT') return;
  // Y and N answer only the approval card you have focused (click it or Tab to it), never a card you have not looked at.
  const card = document.activeElement && document.activeElement.closest ? document.activeElement.closest('.ask') : null;
  const btn = card && card.querySelector('[data-ask]'); if (!btn) return;
  const a = asksOf(snap).find(x => x.perm.askId === btn.dataset.ask && !dismissed.has(x.perm.askId)); if (!a) return;
  if (a.perm.questions) return; // a question is answered with its option buttons, never with a key
  const k = e.key.toLowerCase();
  if ((k === 'y' && !a.perm.defaultToNo) || k === 'n') api('/api/decide', { askId: a.perm.askId, decision: k === 'y' ? 'allow' : 'deny' }).catch(err => showToast(esc(err.message), 4000));
});
desk.update.on(u => { upd = u; render(); });
desk.update.get().then(u => { if (u) { upd = u; render(); } });
desk.guard.get().then(v => { if (v) { GV = v; render(); } }).catch(() => {});
desk.onState(st => { shortcutOk = st.notchShortcutOk !== false; if (st.settings) applySettings(st.settings); mode = st.mode; mute = !!st.mute; fsApp = !!st.fs; peek = !!st.peek; render(); });
desk.onNowPlaying(n => { const was = !!(np && np.playing); np = n && typeof n === 'object' ? n : null; if (!was && np?.playing) npEnter = true; render(); });
desk.onLyrics(l => { lyr = l && Array.isArray(l.lines) ? { key: String(l.key || ''), lines: l.lines.filter(x => Array.isArray(x)).map(([t, text]) => ({ t: +t || 0, text: String(text ?? '') })) } : null; lyrIdx = -2; render(); });
desk.onToggle(() => { pinned = !pinned; if (!pinned) { chatOn = false; hovered = false; } else desk.focus(); render(); });

// ---------- Tiro face: random blink + look-around (idle), and eyes that follow the cursor while it is near ----------
const faceEl = document.createElement('span'); faceEl.id = 'face'; faceEl.className = 'face'; faceEl.setAttribute('aria-hidden', 'true'); faceEl.innerHTML = '<i class="eye"></i><i class="eye"></i>';
let lastPointer = 0;
const look = (x, y) => { faceEl.style.setProperty('--lx', x + 'px'); faceEl.style.setProperty('--ly', y + 'px'); };
const rnd = (a, b) => a + Math.random() * (b - a);
const blinkOnce = ms => { faceEl.classList.add('blink'); setTimeout(() => faceEl.classList.remove('blink'), ms); };
function blinkLoop() { if (!still() && S.kiroFace && faceEl.dataset.mood !== 'done') { blinkOnce(130); if (Math.random() < .2) setTimeout(() => blinkOnce(110), 260); } setTimeout(blinkLoop, rnd(2200, 6000)); }
function lookLoop() {
  if (still() || faceEl.dataset.mood !== 'idle') look(0, 0);
  else if (Date.now() - lastPointer > 1800) { if (Math.random() < .35) look(0, 0); else look(Math.round(rnd(-2, 2)), Math.round(rnd(-1, 1))); }
  setTimeout(lookLoop, rnd(1600, 4200));
}
blinkLoop(); lookLoop();
function followPointer(e) {
  if (still() || !S.kiroFace || faceEl.dataset.mood !== 'idle' || !faceEl.isConnected) return;
  const b = faceEl.getBoundingClientRect(), dx = e.clientX - (b.left + b.width / 2), dy = e.clientY - (b.top + b.height / 2), d = Math.hypot(dx, dy) || 1;
  if (d > 260) return; lastPointer = Date.now(); look(+(dx / d * 2).toFixed(1), +(dy / d * 1.2).toFixed(1));
}

// Clicks pass through the transparent window except over the island itself.
document.addEventListener('mousemove', e => {
  followPointer(e);
  const on = !!e.target.closest('[data-hit]');
  if (on !== hit) { hit = on; desk.interactive(on); }
});

// ---------- live data: the same stream the office uses ----------
function connect() {
  const es = new EventSource('/api/stream');
  es.onopen = () => { online = true; render(); };
  es.onmessage = ev => { const next = JSON.parse(ev.data); notice(next); prev = snap = next; online = true; render(); };
  es.onerror = () => { online = false; render(); };
}
setInterval(() => { if (S.clockInPill || (expanded() && panel === 'calendar')) render(); }, 15000); // keep the clock fresh; render() is a no-op when nothing changed
render(); connect();
</script>
