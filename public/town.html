<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TiroAgents - Town</title>
<script>if(/[#&]from=/.test(location.hash))document.documentElement.classList.add('ao-fade');</script>
<style>html,body{margin:0;height:100%;background:#1b1f2a;color:#e8e6df;font-family:system-ui,sans-serif}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}a{position:fixed;top:12px;left:12px;color:#e8e6df}#err{display:none;position:fixed;inset:0;margin:auto;width:min(420px,80vw);height:fit-content;padding:18px 22px;background:#241b15;border:1px solid #8a5a1c;border-radius:12px}#err a{position:static;display:inline-block;margin-top:10px;color:#ffdca0}#door{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);padding:8px 16px;border-radius:999px;border:1.5px solid #2a1a0c;background:#ffcf6b;color:#2a1a0c;font:600 14px system-ui,sans-serif;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.4)}#tag{position:fixed;transform:translate(-50%,-100%);padding:1px 6px;border:1.2px solid #1b1220;border-radius:4px;color:#1b1220;font:11px ui-monospace,Consolas,monospace;pointer-events:none;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.3)}#door.wait{background:#3a2e25;color:#e8e6df;border-color:#8a5a1c;cursor:default}html{transition:opacity .2s ease}html.ao-fade{opacity:0}</style>
</head>
<body>
<a href="/">Back to the office</a>
<canvas id="town" tabindex="0"></canvas>
<button id="door" hidden></button>
<div id="tag" hidden></div>
<div id="err" role="alert"><div id="errmsg"></div><a href="/">Back to the office</a></div>
<script src="/vendor/pixi.min.js"></script>
<script src="/graphics.js"></script>
<script src="/office-objects.js"></script>
<script src="/role-catalog.js"></script>
<script src="/world-path.js"></script>
<script src="/office-motion.js"></script>
<script src="/office-sprites.js"></script>
<script src="/office-furniture.js"></script>
<script src="/world-model.js"></script>
<script src="/world-player.js"></script>
<script src="/town-map.js"></script>
<script src="/town-ambient.js"></script>
<script src="/town-animals.js"></script>
<script src="/town-render.js"></script>
<script src="/town-render-2d.js"></script>
<script src="/agent-travel.js"></script>
<script>
(async function () {
  let canvas = document.getElementById('town'), api = null, gpuFailed = false;
  const WP = WorldPlayer;
  const fail = e => { document.documentElement.classList.remove('ao-fade'); document.getElementById('errmsg').textContent = 'The town could not load: ' + (e && e.message || e); document.getElementById('err').style.display = 'block'; };
  try {
    // ?failgl=1 is only for perf/town-check.cjs: it makes WebGL setup fail so the Canvas2D fallback can be checked.
    if (/[?&]failgl=1/.test(location.search)) PIXI.Application.prototype.init = () => Promise.reject(new Error('WebGL unavailable'));
    const map = await TownMap.load('/town/town.json'), grid = TownMap.grid(map);
    let drawMap = map, lotsDirty = false; // drawMap: the map with friends' office buildings on their lots (party lots)
    // ?hour=<0-23> is only for visual and perf checks: a fixed time of day.
    const hq = /[?&]hour=(\d+)/.exec(location.search), hour = hq ? Math.min(23, +hq[1]) : null;
    // Town step 5: cows, dogs and cats, placed by wall-clock time so every page agrees; the renderer asks on its ambient frames.
    const herd = TownAnimals.herd(map), night = () => Graphics.nightOf(hour != null ? hour : new Date().getHours() + new Date().getMinutes() / 60);
    const animals = (t, on, visitors) => TownAnimals.frame(herd, Date.now(), grid, { on, night: night(), visitors });
    let stored = await Graphics.load().catch(() => ({ preset: Graphics.detect(Graphics.probe()) }));
    // Settings -> G. GPU asked for (preset or 'GPU if available') but no WebGL, or the GPU mount failed: the town runs
    // with Low's values (spec: the Canvas2D fallback draws the scene at the Low preset). An explicit Canvas2D choice
    // in Custom keeps its other settings.
    const resolveG = () => {
      const env = { ...Graphics.env() }, s = Graphics.normalize(stored);
      if (gpuFailed) env.webgl = false;
      const g = Graphics.resolve(stored, env), asked = s ? (s.preset === 'custom' ? s.custom : Graphics.PRESETS[s.preset]).renderer : 'auto';
      return g.renderer === 'canvas' && asked !== 'canvas' ? Graphics.resolve({ preset: 'low' }, env) : g;
    };
    // Mount the renderer G asks for on a hidden sibling canvas (a WebGL canvas cannot become 2D, so every mount gets a
    // fresh element, same id). -> {api, cv}; a failed attempt's canvas is removed. Only a WebGL init failure (e.gpu)
    // marks gpuFailed for the session. On the first mount only (fallback) any other GPU-path error also retries with
    // Canvas2D at Low, without pinning; a swap keeps the old renderer instead. An asset error (fetch failed twice,
    // e.asset) is reported as it is: Canvas2D needs the same files.
    const mountHidden = async (g, fallback) => {
      const attempt = async (mount, g) => {
        const cv = canvas.cloneNode(false);
        cv.style.cssText = 'position:fixed;left:0;top:0;visibility:hidden'; // laid out at full size, not shown
        canvas.after(cv);
        try { return { api: await mount(cv, { map: drawMap, atlasUrl: '/art/town/atlas.json', terrainUrl: '/art/town/terrain.json', graphics: g, hour, animals }), cv }; } catch (e) { cv.remove(); throw e; }
      };
      if (g.renderer === 'canvas') return attempt(TownRender2D.mount, g);
      try { return await attempt(TownRender.mount, g); } catch (e) {
        if (e && e.gpu) gpuFailed = true;
        if (!fallback || (e && e.asset)) throw e;
        console.info('Town: the GPU renderer failed (' + (e && e.message || e) + '); using Canvas2D at Low.');
        return attempt(TownRender2D.mount, Graphics.resolve({ preset: 'low' }, { ...Graphics.env(), webgl: false }));
      }
    };
    // Show a mounted renderer in place of the current canvas; input listeners are re-wired, focus kept.
    const place = m => {
      const had = document.activeElement === canvas;
      canvas.remove(); canvas = m.cv; canvas.style.cssText = ''; api = m.api;
      if (wire) wire(canvas);
      if (had) canvas.focus();
      api.resize();
    };
    let wire = null, lastTrav = [], swapping = false;
    place(await mountHidden(resolveG(), true));
    // Re-resolve on a settings change, and when power saver (8 fps ambient) or reduced motion (ambient off) changes.
    // A renderer change mounts the other one hidden while the old one keeps drawing, then swaps it in and carries the
    // player, camera and travellers over. Input is ignored while a swap is pending; changes queue so swaps never overlap.
    // If the new mount fails, the old renderer stays (one console.info).
    let queue = Promise.resolve();
    const regraph = () => { queue = queue.then(async () => {
      const g = resolveG();
      if (g.renderer === api.kind && !lotsDirty) return api.setGraphics(g);
      lotsDirty = false;
      swapping = true;
      try {
        const m = await mountHidden(g), old = api;
        place(m); old.destroy(); draw();
        if (lastTrav.length) api.setTravellers(lastTrav);
      } catch (e) { console.info('Town: could not switch renderer (' + (e && e.message || e) + '); keeping the current one.'); }
      finally { swapping = false; }
    }).catch(fail); };
    Graphics.onChange(s => { stored = s; regraph(); });
    addEventListener('storage', e => { if (e.key === 'ao.powerSaver') regraph(); });
    matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', regraph);
    new MutationObserver(regraph).observe(document.documentElement, { attributes: true, attributeFilter: ['data-anim'] });
    // #from=<lot>: back out of a scene, so start at that lot's door (town step 2)
    const fromLot = map.lots.find(l => l.id === (/[#&]from=([^&]*)/.exec(location.hash) || [])[1]);
    const p = WP.unstick(WP.create((fromLot ? fromLot.door : map.spawn).x, (fromLot ? fromLot.door : map.spawn).y), grid), at = { x: p.x, y: p.y };
    let fromHome = !!fromLot && fromLot.id === 'home';
    // Doors: near one, a prompt says where it goes; E or a tap on the prompt fades out and goes there. Friend lots wait for party mode.
    const doorBtn = document.getElementById('door'), html = document.documentElement;
    let near = null;
    let party = null, world = null; // the party view from the stream and its host-centric world (set by partySync below)
    const members = () => (party && party.connected && party.members) || [];
    const target = l => TownMap.friendTarget(l, world, !!(party && party.connected));
    const nearDoor = () => { let best = null, bd = WP.REACH; for (const l of map.lots) { const d = Math.hypot(l.door.x - p.x, l.door.y - p.y); if (d <= bd) { bd = d; best = l; } } return best; };
    const showDoor = force => { // force: same door, but the party changed who owns it (the label)
      const l = nearDoor(); if (l === near && !force) return; near = l;
      if (!l) { doorBtn.hidden = true; return; }
      const t = target(l); doorBtn.textContent = t.url ? t.label + ' · E' : t.label; doorBtn.className = t.url ? '' : 'wait'; doorBtn.hidden = false;
    };
    const enter = () => { const t = near && target(near); if (!t || !t.url || html.classList.contains('ao-fade')) return; html.classList.add('ao-fade'); setTimeout(() => { location.href = t.url; }, 200); };
    doorBtn.addEventListener('click', () => { enter(); canvas.focus(); });
    addEventListener('pageshow', e => { if (e.persisted) html.classList.remove('ao-fade'); }); // back/forward cache: show the town again
    requestAnimationFrame(() => html.classList.remove('ao-fade'));
    let look = OfficeSprites.lookOf({ look: 'ceo' }), pose = 'stand', frame = 0;
    const draw = () => { api.setPlayer({ x: p.x, y: p.y, face: p.face, pose, frame, look }); api.setCamera(p.x, p.y); showDoor(); };
    draw();

    // Town step 3: agents walking to the karinderya or game hall. Same trip records and sync as the office page (shared
    // localStorage), judged against the office layout's flags; only travellers whose where() is in town are drawn.
    // The rAF runs only while one is on the road; otherwise one timeout waits for the next town leg to start.
    const AT = AgentTravel, routes = (a, b) => AT.route(map, a, b), spots = TownMap.spotsOf(map), trips_ = AT.store(), walked = new Map(), tag = document.getElementById('tag');
    let snap = null, office = null, trips = {}, friends = [], tRaf = 0, tWake = 0, owv = {}, looksSig = '', hover = null;
    const officeFlags = () => fetch('/api/world', { headers: { 'x-nonce': (document.cookie.match(/(?:^|; )ao_nonce=([^;]*)/) || [])[1] || '' } }).then(r => r.ok ? r.json() : null).then(j => { if (j && j.layout) { office = OfficeMotion.travelFlags(WorldModel.spotsOf(j.layout)); resync(); } }).catch(() => {});
    const resync = () => {
      if (snap) partySync(snap.party);
      if (snap && office) trips = trips_.sync(snap.agents || [], office, OfficeMotion.boardOf(snap).empty, Date.now(), routes, (world && world.mine) || 'home', spots);
      if (snap) friends = trips_.friends(snap.party, Date.now(), routes); // party friends' agents: name · friend, no costume
      kick();
    };
    const kick = () => { if (!tRaf) tRaf = requestAnimationFrame(tTick); };
    // Party lots (town step 5): friends' offices stand on the friend lots, and members walking the town show where they
    // are, gliding to each position update. Your own position is sent once a second while it changes.
    const guests = new Map(), GUEST_SPEED = 160; // id -> {x, y, tx, ty, face, dist, name}
    let lotsKey = '[]', guestAt = 0, avKey = ''; // '[]': no friend lots, the map as loaded (no remount outside a party)
    function partySync(P) {
      party = P || null;
      const ms = members(); world = TownMap.partyWorld(party);
      const key = JSON.stringify(world ? Object.entries(world.owners).filter(([l]) => l !== 'home').map(([l, o]) => [l, o.id]) : []);
      if (key !== lotsKey) { lotsKey = key; drawMap = TownMap.withFriends(map, world); lotsDirty = true; regraph(); }
      showDoor(true); // door labels follow the party (who owns which lot)
      // Out of your own office in a party where you are a guest: you come out at your lot, not the host's house (once,
      // and only if you have not walked yet).
      if (fromHome && world && world.mine && world.mine !== 'home' && !p.moving && p.x === at.x && p.y === at.y) {
        const d = map.lots.find(l => l.id === world.mine).door, q = WP.unstick(WP.create(d.x, d.y), grid); p.x = q.x; p.y = q.y; fromHome = false; draw();
      }
      const seen = new Set();
      for (const m of ms) {
        const a = m.avatar; if (!a || a.room !== 'town') continue;
        seen.add(m.id);
        const g = guests.get(m.id);
        if (g) { g.tx = a.x; g.ty = a.y; g.name = m.name; } else guests.set(m.id, { x: a.x, y: a.y, tx: a.x, ty: a.y, face: 's', dist: 0, name: m.name });
      }
      for (const id of [...guests.keys()]) if (!seen.has(id)) guests.delete(id);
    }
    function guestList(now) {
      const dt = guestAt ? Math.min(0.25, (now - guestAt) / 1000) : 0; guestAt = now;
      const out = [];
      for (const [id, g] of guests) {
        const dx = g.tx - g.x, dy = g.ty - g.y, d = Math.hypot(dx, dy), step = GUEST_SPEED * dt;
        const moving = d > 0.5;
        if (moving) {
          const k = d > 400 || step >= d ? 1 : step / d; // far behind (a missed update): jump
          const nx = g.x + dx * k, ny = g.y + dy * k;
          g.face = TownRender.faceAlong({ x: g.x, y: g.y }, { x: nx, y: ny }, g.face); g.dist += Math.hypot(nx - g.x, ny - g.y); g.x = nx; g.y = ny;
        }
        out.push({ id: 'guest:' + id, x: g.x, y: g.y, face: g.face, frame: moving ? TownRender.walkFrame(g.dist) : 0, look: OfficeSprites.lookOf({ id, name: g.name }), name: g.name, accent: '#ffcf6b', moving });
      }
      return out;
    }
    setInterval(() => {
      if (!party || !party.connected || document.hidden) return;
      const k = Math.round(p.x) + ',' + Math.round(p.y); if (k === avKey) return; avKey = k;
      fetch('/api/party/avatar', { method: 'POST', headers: { 'content-type': 'application/json', 'x-nonce': (document.cookie.match(/(?:^|; )ao_nonce=([^;]*)/) || [])[1] || '' }, body: JSON.stringify({ x: p.x, y: p.y, room: 'town' }) }).catch(() => { avKey = ''; });
    }, 1000);
    function travellers(now, peek) { // peek: a read-only snapshot (debug hook), the walk state stays as it is
      const out = [], seen = new Map();
      for (const a of ((snap && snap.agents) || []).concat(friends)) {
        const rec = a.trip || trips[a.id]; if (!rec) continue;
        let w, n, b; try { w = AT.where(rec, now, routes); n = AT.where(rec, now + 50, routes); b = AT.where(rec, now - 50, routes); } catch (e) { continue; }
        if (w.scene !== 'town' || !w.pos) continue;
        const pos = w.pos, last = walked.get(a.id), [p0, p1] = n.pos ? [pos, n.pos] : [b.pos || pos, pos], parked = w.leg === 'there'; // the path segment it is on; parked: at a spot
        const face = parked ? w.face : TownRender.faceAlong(p0, p1, last ? last.face : 's'), dist = last ? last.dist + Math.hypot(pos.x - last.x, pos.y - last.y) : 0;
        seen.set(a.id, { x: pos.x, y: pos.y, dist, face });
        out.push({ id: a.id, x: pos.x, y: pos.y, face, frame: TownRender.walkFrame(dist), look: OfficeSprites.lookOf(a.profile ? { id: a.id, name: a.name, key: a.profile.key, color: a.profile.color, accent: a.profile.accent } : a), name: a.name || 'Helper', accent: a.profile && a.profile.accent, moving: !parked, ...(parked ? { pose: w.act, spot: w.spot } : null) });
      }
      if (!peek) { walked.clear(); for (const [k, v] of seen) walked.set(k, v); }
      return peek ? out : out.concat(guestList(now));
    }
    function tTick() {
      tRaf = 0; clearTimeout(tWake); tWake = 0;
      const now = Date.now(), list = travellers(now);
      api.setTravellers(list); lastTrav = list; showTag(list);
      if (list.some(t => t.moving !== false)) { tRaf = requestAnimationFrame(tTick); return; } // agents on the road always move; guests only while gliding
      let next = Infinity;
      for (const tr of Object.values(trips).concat(friends.map(f => f.trip))) next = Math.min(next, AT.nextIn(tr, 'town', now, routes));
      if (next < Infinity) tWake = setTimeout(kick, Math.min(next - now + 1, 2147483647));
    }
    // Hover shows the name only (the desk card stays on the office page).
    function showTag(list) {
      const t = hover && list.length ? api.travellerAt(hover.x, hover.y) : null, a = t && list.find(o => o.id === t.id);
      if (!a) { tag.hidden = true; return; }
      const r = canvas.getBoundingClientRect();
      tag.textContent = a.name; tag.style.background = a.accent || '#d8d2c4';
      tag.style.left = (r.left + t.sx) + 'px'; tag.style.top = (r.top + t.sy - 2) + 'px'; tag.hidden = false;
    }
    try { // the stream: the CEO's saved wardrobe and the agents (trips); the office layout's flags when it changes
      const es = new EventSource('/api/stream');
      es.onmessage = ev => {
        try {
          const d = JSON.parse(ev.data), sig = JSON.stringify(d.looks || null);
          if (sig !== looksSig) { looksSig = sig; OfficeSprites.setCostumes(d.looks); look = OfficeSprites.lookOf({ look: 'ceo' }); draw(); } // only on change: idle stays idle
          const v = d.worldVersion && d.worldVersion.office;
          if (v !== owv) { owv = v; officeFlags(); }
          snap = d; resync();
        } catch (e) {}
      };
    } catch (e) {}
    window.__town = { get api() { return api; }, p, grid, map, toWorld: (x, y) => api.toWorld(x, y), near: () => near && near.id, travellers: () => travellers(Date.now(), true), trips: () => trips, world: () => world, guests: () => [...guests].map(([id, g]) => ({ id, x: g.tx, y: g.ty, name: g.name })), lots: () => drawMap.lots.map(l => l.id + ':' + l.building.type) }; // handle for perf/town-check.cjs and perf/scene-check.cjs

    const keys = new Set();
    let raf = 0, last = 0;
    const input = () => { let dx = 0, dy = 0; for (const k of keys) { const d = WP.DIRS[k]; if (d) { dx += d[0]; dy += d[1]; } } return { dx: Math.sign(dx), dy: Math.sign(dy) }; };
    function tick(now) {
      raf = 0;
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      WP.step(p, dt, input(), grid);
      pose = p.moving ? 'walk' : 'stand'; frame = p.moving ? 1 + (Math.floor(now / 1000 * 6) % 2) : 0;
      draw();
      if (keys.size || p.moving || p.pi < p.path.length) raf = requestAnimationFrame(tick);
    }
    const go = () => { if (!raf) { last = performance.now(); raf = requestAnimationFrame(tick); } };
    const state = e => ({ shown: true, canvas });
    addEventListener('keydown', e => {
      if (swapping) return; // a renderer swap is pending
      const act = WP.takesKey(e, state(e));
      if (act === 'interact') { if (near) { e.preventDefault(); enter(); } return; }
      if (act !== 'move') return;
      e.preventDefault(); keys.add(WP.keyOf(e)); go();
    });
    addEventListener('keyup', e => { keys.delete(WP.keyOf(e)); });
    const release = () => keys.clear(); // a key released while unfocused never sends keyup
    addEventListener('blur', release);
    document.addEventListener('visibilitychange', () => { if (document.hidden) release(); });
    wire = c => { // canvas input; re-run on every fresh canvas
      c.addEventListener('pointermove', e => { const r = c.getBoundingClientRect(); hover = { x: e.clientX - r.left, y: e.clientY - r.top }; }); // the traveller loop shows the tag
      c.addEventListener('pointerleave', () => { hover = null; tag.hidden = true; });
      c.addEventListener('pointerdown', e => {
        if (swapping) return;
        const r = c.getBoundingClientRect(), [x, y] = api.toWorld(e.clientX - r.left, e.clientY - r.top);
        if (WP.walkTo(p, { x, y }, grid)) go();
      });
    };
    wire(canvas);
    addEventListener('resize', () => { api.resize(); draw(); });
  } catch (e) { fail(e); }
})();
</script>
</body>
</html>
